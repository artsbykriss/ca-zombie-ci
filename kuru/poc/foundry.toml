[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# Keyless public Monad RPC. Foundry uses it to instantiate the Monad EVM for the
# whole `forge test` run, so `block.number`/state are Monad mainnet (chain 143).
eth_rpc_url = "https://rpc.monad.xyz"
