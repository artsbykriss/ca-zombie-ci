[package]
name = "marginfi-liq-harness"
version = "0.1.0"
edition = "2021"
description = "LiteSVM harness executing the deployed marginfi program against cloned mainnet state"

[dependencies]
litesvm = "0.18"
solana-account = "4"
solana-address = "~2.7"
solana-clock = "~3.2"
solana-instruction = "~3.5"
solana-keypair = "3"
solana-message = "4"
solana-signer = "3"
solana-transaction = "4"
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
