[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
via_ir = false

remappings = [
  "@openzeppelin/contracts/=src/lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=src/lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]
