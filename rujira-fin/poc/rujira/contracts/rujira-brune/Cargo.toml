[package]
authors = []
edition = { workspace = true }
name    = "rujira-brune"
version = "3.2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[package.metadata.thorchain]
# See more about format in https://doc.rust-lang.org/cargo/reference/manifest.html#the-metadata-table
auditors = [""]
audits   = [""]
docs     = ""

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# use library feature to disable all instantiate/execute/query exports
library = []

[dependencies]
cosmwasm-schema = { workspace = true }
cosmwasm-std    = { workspace = true }
cw-storage-plus = { workspace = true }
cw-utils        = { workspace = true }
cw2             = { workspace = true }
rujira-rs       = { workspace = true, features = ["interface-brune", "interface-fin", "msg", "oracle", "query"], default-features = false }
schemars        = { workspace = true }
serde           = { workspace = true }
thiserror       = { workspace = true }

[dev-dependencies]
anybuf            = { workspace = true }
cw-multi-test     = { workspace = true }
proptest          = { workspace = true }
prost             = { workspace = true }
rujira-fin        = { workspace = true, features = ["mock"] }
rujira-rs-testing = { workspace = true }
rujira-staking    = { workspace = true, features = ["mock"] }
