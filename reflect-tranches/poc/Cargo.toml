[package]
name = "reflect-auth-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
litesvm = "0.18"
solana-account = "4.3"
solana-address = "2.7"
solana-clock = { version = "3.2", features = ["sysvar", "wincode"] }
solana-hash = "4.6"
solana-instruction = "3.5"
solana-keypair = "3.1"
solana-message = "4.2"
solana-signer = "3.0"
solana-transaction = "4.1"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 2
