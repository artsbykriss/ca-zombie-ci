[package]
name = "rain-fleet-poc"
version = "0.1.0"
edition = "2021"

[dependencies]
litesvm = { version = "0.18", features = ["precompiles"] }
solana-transaction = "4"
solana-account = "4"
solana-address = "2"
solana-message = "4"
solana-hash = "4"
solana-signature = "3"
bincode = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"

[profile.dev]
opt-level = 1
