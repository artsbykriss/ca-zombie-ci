[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fuzz = { runs = 32 }

remappings = [
  "v4-core/=lib/v4-core/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@prb/math/=lib/prb-math/",
  "forge-std/=lib/forge-std/src/",
]
