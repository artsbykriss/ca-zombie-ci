[package]
name = "deep-rewards"
version = "0.1.0"
description = "DEEP Holder Rewards: per-(token, reward asset) cumulative Merkle distributor"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "deep_rewards"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# cfgs referenced by Anchor/Solana macro expansions.
anchor-debug = []
custom-heap = []
custom-panic = []
litesvm-tests = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[dependencies]
anchor-lang = { version = "=1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "=1.2.0", features = ["token", "token_2022", "associated_token"] }
solana-security-txt = "1.1.1"
# sha256 via the `sol_sha256` syscall on chain (software sha2 on the host for tests); the same
# crate/version solana-program 3 uses.
solana-sha256-hasher = "3.1"

[dev-dependencies]
serde_json = "1"
proptest = "1"
litesvm = "0.17"
solana-keypair = "3.1"
solana-signer = "3"
solana-transaction = "4.1"
solana-message = "4.2"
solana-transaction-error = "3.4"
solana-instruction-error = "2.5"
solana-account = "4"

# LiteSVM integration tests need the compiled SBF artifact; run via
# `node scripts/programs-test.mjs --sbf` (builds the .so first).
[[test]]
name = "litesvm"
required-features = ["litesvm-tests"]
