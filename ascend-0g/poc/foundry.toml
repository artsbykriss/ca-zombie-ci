[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./ci-out" }]

# keyless public 0G (chainId 16661) endpoints; no secrets committed
[rpc_endpoints]
og = "https://evmrpc.0g.ai"
og2 = "https://0g-rpc.publicnode.com"
